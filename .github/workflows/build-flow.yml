name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-flow:
    # Scoped to the union of permissions requested by the called workflow's jobs
    # (container/release need contents+packages write, codeql needs security-events).
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@v0.2.1
    secrets: inherit
    with:
      # Dependabot pull requests cannot access organization secrets, including
      # the licensed Gitleaks token. Keep the scan enabled for all other runs.
      enable-gitleaks: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
      ci-profile: node-bun
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bunx biome check . --reporter=github
      ci-typecheck-command: bun run typecheck
      ci-test-command: bun run test
      ci-docker-smoke-command: docker build -t test-build .
      ci-matrix-versions: '["22","24","26"]'
      codeql-build-mode: none
      enable-package: false
      enable-container: true
      container-registry: both
